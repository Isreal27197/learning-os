<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
  <title id="title">Vector addition by placing arrows head to tail</title>
  <desc id="description">On a coordinate grid, u equals (2, 1) and v equals (1, 2). Shifting v to the head of u shows the resultant u plus v equals (3, 3).</desc>
  <defs>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#176b54"/>
    </marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#245e9b"/>
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#b55b13"/>
    </marker>
    <pattern id="grid" width="70" height="70" patternUnits="userSpaceOnUse">
      <path d="M70 0 H0 V70" fill="none" stroke="#d8e2e8" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="620" rx="18" fill="#ffffff"/>
  <text x="54" y="58" fill="#172b3a" font-family="Arial, sans-serif" font-size="30" font-weight="700">Vector addition: place arrows head to tail</text>
  <text x="54" y="92" fill="#405565" font-family="Arial, sans-serif" font-size="19">u = (2, 1), v = (1, 2), so u + v = (3, 3)</text>
  <rect x="70" y="125" width="700" height="420" fill="url(#grid)" stroke="#a8bdc9" stroke-width="2"/>
  <path d="M140 475 H700 M140 475 V195" stroke="#405565" stroke-width="2"/>
  <g fill="#405565" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">
    <text x="140" y="501">0</text><text x="280" y="501">2</text><text x="350" y="501">3</text>
    <text x="119" y="409">1</text><text x="119" y="269">3</text>
  </g>
  <g stroke="#176b54" stroke-width="5" fill="none" marker-end="url(#arrow-green)">
    <path d="M140 475 L280 405"/>
  </g>
  <g stroke="#245e9b" stroke-width="4" fill="none" marker-end="url(#arrow-blue)">
    <path d="M140 475 L210 335"/>
  </g>
  <g stroke="#245e9b" stroke-width="4" stroke-dasharray="9 7" fill="none" marker-end="url(#arrow-blue)">
    <path d="M280 405 L350 265"/>
  </g>
  <g stroke="#b55b13" stroke-width="6" fill="none" marker-end="url(#arrow-orange)">
    <path d="M140 475 L350 265"/>
  </g>
  <g fill="#172b3a" font-family="Arial, sans-serif" font-size="17" font-weight="700">
    <text x="220" y="420">u</text>
    <text x="170" y="390">v</text>
    <text x="304" y="340">shifted v</text>
    <text x="255" y="330" fill="#9b4c0d">u + v</text>
  </g>
  <rect x="815" y="150" width="330" height="345" rx="14" fill="#f3f8fc" stroke="#52758b" stroke-width="2"/>
  <text x="845" y="198" fill="#172b3a" font-family="Arial, sans-serif" font-size="22" font-weight="700">Component rule</text>
  <text x="845" y="248" fill="#176b54" font-family="Arial, sans-serif" font-size="21">u = (2, 1)</text>
  <text x="845" y="290" fill="#245e9b" font-family="Arial, sans-serif" font-size="21">v = (1, 2)</text>
  <path d="M845 313 H1108" stroke="#a8bdc9" stroke-width="2"/>
  <text x="845" y="355" fill="#172b3a" font-family="Arial, sans-serif" font-size="20">(2 + 1, 1 + 2)</text>
  <text x="845" y="405" fill="#9b4c0d" font-family="Arial, sans-serif" font-size="23" font-weight="700">= (3, 3)</text>
  <text x="845" y="456" fill="#405565" font-family="Arial, sans-serif" font-size="16">The diagonal arrow is the sum.</text>
</svg>
