<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title description">
  <title id="title">INNER JOIN and LEFT JOIN comparison</title>
  <desc id="description">The subjects table has Python, SQL and Statistics. Sessions match Python and SQL. INNER JOIN returns only matched rows, while LEFT JOIN keeps Statistics with a NULL session.</desc>
  <rect width="1200" height="650" rx="18" fill="#ffffff"/>
  <text x="52" y="55" fill="#172b3a" font-family="Arial, sans-serif" font-size="29" font-weight="700">Join results depend on which rows you preserve</text>
  <text x="52" y="86" fill="#405565" font-family="Arial, sans-serif" font-size="17">Inputs: three subjects, but only two have study sessions.</text>

  <g font-family="Arial, sans-serif">
    <rect x="52" y="112" width="290" height="215" rx="12" fill="#f3f8fc" stroke="#52758b" stroke-width="2"/>
    <rect x="52" y="112" width="290" height="48" rx="12" fill="#dcecf4"/>
    <text x="72" y="143" fill="#172b3a" font-size="20" font-weight="700">subjects (left table)</text>
    <text x="75" y="192" fill="#405565" font-size="15" font-weight="700">subject_id</text>
    <text x="205" y="192" fill="#405565" font-size="15" font-weight="700">name</text>
    <path d="M52 204 H342" stroke="#a8bdc9"/>
    <text x="78" y="235" fill="#172b3a" font-size="17">1</text><text x="205" y="235" fill="#172b3a" font-size="17">Python</text>
    <text x="78" y="269" fill="#172b3a" font-size="17">2</text><text x="205" y="269" fill="#172b3a" font-size="17">SQL</text>
    <text x="78" y="303" fill="#172b3a" font-size="17">3</text><text x="205" y="303" fill="#172b3a" font-size="17">Statistics</text>

    <rect x="52" y="358" width="290" height="215" rx="12" fill="#f3f8fc" stroke="#52758b" stroke-width="2"/>
    <rect x="52" y="358" width="290" height="48" rx="12" fill="#dcecf4"/>
    <text x="72" y="389" fill="#172b3a" font-size="20" font-weight="700">sessions (right table)</text>
    <text x="78" y="438" fill="#405565" font-size="15" font-weight="700">subject_id</text>
    <text x="205" y="438" fill="#405565" font-size="15" font-weight="700">minutes</text>
    <path d="M52 450 H342" stroke="#a8bdc9"/>
    <text x="78" y="481" fill="#172b3a" font-size="17">1</text><text x="205" y="481" fill="#172b3a" font-size="17">30</text>
    <text x="78" y="515" fill="#172b3a" font-size="17">2</text><text x="205" y="515" fill="#172b3a" font-size="17">20</text>
    <text x="78" y="549" fill="#172b3a" font-size="17">2</text><text x="205" y="549" fill="#172b3a" font-size="17">15</text>
  </g>
  <path d="M360 225 H414" stroke="#176b54" stroke-width="3"/>
  <path d="M360 470 H414" stroke="#176b54" stroke-width="3"/>
  <text x="357" y="345" fill="#176b54" font-family="Arial, sans-serif" font-size="14" font-weight="700">match subject_id</text>

  <g font-family="Arial, sans-serif">
    <rect x="430" y="112" width="350" height="461" rx="12" fill="#f3f8fc" stroke="#52758b" stroke-width="2"/>
    <rect x="430" y="112" width="350" height="48" rx="12" fill="#dcecf4"/>
    <text x="452" y="143" fill="#172b3a" font-size="21" font-weight="700">INNER JOIN</text>
    <text x="452" y="183" fill="#405565" font-size="15">Only rows with a match</text>
    <text x="452" y="220" fill="#405565" font-size="14" font-weight="700">subject</text>
    <text x="650" y="220" fill="#405565" font-size="14" font-weight="700">minutes</text>
    <path d="M430 231 H780" stroke="#a8bdc9"/>
    <rect x="444" y="240" width="322" height="48" rx="6" fill="#e5f3ed"/>
    <text x="458" y="271" fill="#172b3a" font-size="17">Python</text><text x="650" y="271" fill="#172b3a" font-size="17">30</text>
    <rect x="444" y="296" width="322" height="48" rx="6" fill="#e5f3ed"/>
    <text x="458" y="327" fill="#172b3a" font-size="17">SQL</text><text x="650" y="327" fill="#172b3a" font-size="17">20</text>
    <rect x="444" y="352" width="322" height="48" rx="6" fill="#e5f3ed"/>
    <text x="458" y="383" fill="#172b3a" font-size="17">SQL</text><text x="650" y="383" fill="#172b3a" font-size="17">15</text>
    <rect x="444" y="425" width="322" height="100" rx="8" fill="#edf2f5"/>
    <text x="462" y="461" fill="#405565" font-size="16" font-weight="700">Statistics is absent</text>
    <text x="462" y="490" fill="#405565" font-size="15">because it has no matching session.</text>

    <rect x="810" y="112" width="340" height="461" rx="12" fill="#f3f8fc" stroke="#52758b" stroke-width="2"/>
    <rect x="810" y="112" width="340" height="48" rx="12" fill="#dcecf4"/>
    <text x="832" y="143" fill="#172b3a" font-size="21" font-weight="700">LEFT JOIN</text>
    <text x="832" y="183" fill="#405565" font-size="15">Keep every subject on the left</text>
    <text x="832" y="220" fill="#405565" font-size="14" font-weight="700">subject</text>
    <text x="1032" y="220" fill="#405565" font-size="14" font-weight="700">minutes</text>
    <path d="M810 231 H1150" stroke="#a8bdc9"/>
    <rect x="824" y="240" width="312" height="48" rx="6" fill="#e5f3ed"/>
    <text x="838" y="271" fill="#172b3a" font-size="17">Python</text><text x="1032" y="271" fill="#172b3a" font-size="17">30</text>
    <rect x="824" y="296" width="312" height="48" rx="6" fill="#e5f3ed"/>
    <text x="838" y="327" fill="#172b3a" font-size="17">SQL</text><text x="1032" y="327" fill="#172b3a" font-size="17">20</text>
    <rect x="824" y="352" width="312" height="48" rx="6" fill="#e5f3ed"/>
    <text x="838" y="383" fill="#172b3a" font-size="17">SQL</text><text x="1032" y="383" fill="#172b3a" font-size="17">15</text>
    <rect x="824" y="408" width="312" height="48" rx="6" fill="#fff1df"/>
    <text x="838" y="439" fill="#172b3a" font-size="17">Statistics</text><text x="1032" y="439" fill="#9b4c0d" font-size="17" font-weight="700">NULL</text>
    <text x="832" y="500" fill="#405565" font-size="15">Unmatched right-side values are NULL.</text>
  </g>
  <text x="52" y="615" fill="#405565" font-family="Arial, sans-serif" font-size="16">The join condition matches subjects.subject_id to sessions.subject_id.</text>
</svg>
