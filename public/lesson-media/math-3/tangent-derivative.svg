<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
  <title id="title">Derivative as the slope of a tangent</title>
  <desc id="description">The curve y equals x squared passes through (1, 1). Its tangent there has slope 2 and is shown as the line y equals 2x minus 1. A nearby secant line approaches the tangent as its second point moves toward x equals 1.</desc>
  <rect width="1200" height="620" rx="18" fill="#ffffff"/>
  <text x="54" y="58" fill="#172b3a" font-family="Arial, sans-serif" font-size="30" font-weight="700">A derivative is a local rate of change</text>
  <text x="54" y="94" fill="#405565" font-family="Arial, sans-serif" font-size="19">For f(x) = x², the tangent slope at x = 1 is f′(1) = 2.</text>
  <rect x="70" y="125" width="700" height="420" fill="#fbfdfe" stroke="#a8bdc9" stroke-width="2"/>
  <path d="M140 460 H710 M300 515 V160" stroke="#405565" stroke-width="2"/>
  <g stroke="#d8e2e8" stroke-width="1">
    <path d="M140 430 H710 M140 400 H710 M140 370 H710 M140 340 H710 M140 310 H710 M140 280 H710 M140 250 H710 M140 220 H710 M140 190 H710"/>
    <path d="M210 160 V515 M390 160 V515 M480 160 V515 M570 160 V515 M660 160 V515"/>
  </g>
  <path d="M165 392 C210 430 255 451 300 460 C345 451 390 430 435 392 C480 340 525 272 570 190" fill="none" stroke="#245e9b" stroke-width="6"/>
  <path d="M310 484 L570 316" stroke="#176b54" stroke-width="5"/>
  <path d="M390 430 L435 392" stroke="#b55b13" stroke-width="4" stroke-dasharray="10 8"/>
  <circle cx="390" cy="430" r="8" fill="#172b3a"/>
  <circle cx="435" cy="392" r="8" fill="#b55b13"/>
  <g fill="#172b3a" font-family="Arial, sans-serif" font-size="18" font-weight="700">
    <text x="400" y="454">(1, 1)</text>
    <text x="540" y="340" fill="#176b54">tangent: slope 2</text>
    <text x="444" y="410" fill="#9b4c0d">secant</text>
    <text x="210" y="325" fill="#245e9b">y = x²</text>
  </g>
  <rect x="815" y="150" width="330" height="345" rx="14" fill="#f3f8fc" stroke="#52758b" stroke-width="2"/>
  <text x="845" y="198" fill="#172b3a" font-family="Arial, sans-serif" font-size="22" font-weight="700">Difference quotient</text>
  <text x="845" y="250" fill="#172b3a" font-family="Arial, sans-serif" font-size="19">[f(1+h) − f(1)] / h</text>
  <text x="845" y="295" fill="#405565" font-family="Arial, sans-serif" font-size="18">= [(1+h)² − 1] / h</text>
  <text x="845" y="340" fill="#405565" font-family="Arial, sans-serif" font-size="18">= 2 + h</text>
  <path d="M845 365 H1108" stroke="#a8bdc9" stroke-width="2"/>
  <text x="845" y="411" fill="#176b54" font-family="Arial, sans-serif" font-size="22" font-weight="700">as h → 0, slope → 2</text>
  <text x="845" y="457" fill="#405565" font-family="Arial, sans-serif" font-size="16">The derivative is the limiting slope.</text>
</svg>
