<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
  <title id="title">Gradient descent steps toward a minimum</title>
  <desc id="description">Nested elliptical contours represent a bowl-shaped loss surface with a minimum at the center. Iterates w0, w1, and w2 move toward the center in the negative-gradient direction; gradients point uphill, and each update subtracts learning rate times gradient.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#245e9b"/>
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#b55b13"/>
    </marker>
  </defs>
  <rect width="1200" height="620" rx="18" fill="#ffffff"/>
  <text x="54" y="58" fill="#172b3a" font-family="Arial, sans-serif" font-size="30" font-weight="700">Gradient descent moves downhill on a loss surface</text>
  <text x="54" y="94" fill="#405565" font-family="Arial, sans-serif" font-size="19">For a smooth bowl, subtracting the gradient moves toward lower loss.</text>
  <rect x="70" y="125" width="700" height="420" fill="#fbfdfe" stroke="#a8bdc9" stroke-width="2"/>
  <path d="M140 475 H720 M420 520 V155" stroke="#405565" stroke-width="2"/>
  <g fill="none" stroke-width="3">
    <ellipse cx="430" cy="335" rx="255" ry="155" stroke="#d8e2e8"/>
    <ellipse cx="430" cy="335" rx="195" ry="120" stroke="#b8d5c9"/>
    <ellipse cx="430" cy="335" rx="135" ry="82" stroke="#81b7a2"/>
    <ellipse cx="430" cy="335" rx="72" ry="43" stroke="#438a6f"/>
  </g>
  <path d="M665 205 L585 250 L500 292 L435 330" fill="none" stroke="#245e9b" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <circle cx="665" cy="205" r="8" fill="#245e9b"/>
  <circle cx="585" cy="250" r="8" fill="#245e9b"/>
  <circle cx="500" cy="292" r="8" fill="#245e9b"/>
  <circle cx="430" cy="335" r="8" fill="#176b54"/>
  <path d="M585 250 L650 192" fill="none" stroke="#b55b13" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#arrow-orange)"/>
  <g fill="#172b3a" font-family="Arial, sans-serif" font-size="17" font-weight="700">
    <text x="678" y="205">w₀</text>
    <text x="585" y="238">w₁</text>
    <text x="500" y="281">w₂</text>
    <text x="440" y="330" fill="#176b54">minimum</text>
    <text x="650" y="175" fill="#9b4c0d">∇L points uphill</text>
  </g>
  <rect x="815" y="150" width="330" height="345" rx="14" fill="#f3f8fc" stroke="#52758b" stroke-width="2"/>
  <text x="845" y="198" fill="#172b3a" font-family="Arial, sans-serif" font-size="22" font-weight="700">Parameter update</text>
  <text x="845" y="255" fill="#172b3a" font-family="Arial, sans-serif" font-size="22">wₜ₊₁ = wₜ − η∇L(wₜ)</text>
  <text x="845" y="305" fill="#405565" font-family="Arial, sans-serif" font-size="17">η is the learning rate.</text>
  <text x="845" y="345" fill="#405565" font-family="Arial, sans-serif" font-size="17">The negative sign points downhill.</text>
  <path d="M845 370 H1108" stroke="#a8bdc9" stroke-width="2"/>
  <text x="845" y="415" fill="#176b54" font-family="Arial, sans-serif" font-size="19" font-weight="700">Too large: may overshoot.</text>
  <text x="845" y="455" fill="#405565" font-family="Arial, sans-serif" font-size="17">A small step may be slow.</text>
</svg>
