<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
  <title id="title">Function mapping from domain to codomain</title>
  <desc id="description">The function f of x equals 2x plus 1 maps domain values 0, 1 and 2 to outputs 1, 3 and 5. The codomain also contains 7, which is not in the range.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#176b54"/>
    </marker>
  </defs>
  <rect width="1200" height="620" rx="18" fill="#ffffff"/>
  <text x="54" y="58" fill="#172b3a" font-family="Arial, sans-serif" font-size="30" font-weight="700">A function assigns one output to each allowed input</text>
  <text x="54" y="92" fill="#405565" font-family="Arial, sans-serif" font-size="19">f(x) = 2x + 1</text>

  <g font-family="Arial, sans-serif">
    <rect x="80" y="130" width="390" height="420" rx="18" fill="#f3f8fc" stroke="#52758b" stroke-width="2"/>
    <rect x="730" y="130" width="390" height="420" rx="18" fill="#f3f8fc" stroke="#52758b" stroke-width="2"/>
    <text x="275" y="174" text-anchor="middle" fill="#172b3a" font-size="23" font-weight="700">Domain</text>
    <text x="925" y="174" text-anchor="middle" fill="#172b3a" font-size="23" font-weight="700">Codomain</text>
    <text x="275" y="204" text-anchor="middle" fill="#405565" font-size="16">allowed inputs</text>
    <text x="925" y="204" text-anchor="middle" fill="#405565" font-size="16">stated target values</text>
  </g>
  <g fill="#e5f3ed" stroke="#176b54" stroke-width="2">
    <circle cx="275" cy="270" r="31"/><circle cx="275" cy="355" r="31"/><circle cx="275" cy="440" r="31"/>
    <circle cx="925" cy="270" r="31"/><circle cx="925" cy="355" r="31"/><circle cx="925" cy="440" r="31"/>
  </g>
  <g fill="#172b3a" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">
    <text x="275" y="278">0</text><text x="275" y="363">1</text><text x="275" y="448">2</text>
    <text x="925" y="278">1</text><text x="925" y="363">3</text><text x="925" y="448">5</text>
  </g>
  <circle cx="925" cy="510" r="27" fill="#fff1df" stroke="#b55b13" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="925" y="517" fill="#9b4c0d" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">7</text>
  <g fill="none" stroke="#176b54" stroke-width="3" marker-end="url(#arrow)">
    <path d="M315 270 C510 250 685 250 883 270"/>
    <path d="M315 355 C510 355 685 355 883 355"/>
    <path d="M315 440 C510 460 685 460 883 440"/>
  </g>
  <text x="585" y="540" fill="#405565" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">Range = {1, 3, 5} — the outputs actually reached</text>
  <text x="925" y="558" fill="#9b4c0d" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">7 is in the codomain, not the range</text>
</svg>
